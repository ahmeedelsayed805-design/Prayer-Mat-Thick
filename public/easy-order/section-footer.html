<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فوتر الموقع - سجادة الصلاة الطبية</title>
  <!-- خط كايرو من Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* إعادة ضبط أساسية والخط */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #0b1329;
      color: #94a3b8;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* سيكشن الفوتر الداكن */
    .footer-section-eo {
      background-color: #0b1329;
      color: #94a3b8;
      padding: 45px 16px 30px;
      direction: rtl;
      text-align: right;
      box-sizing: border-box;
      border-top: 1px solid #1e293b;
    }

    .footer-section-eo * {
      box-sizing: border-box;
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
    }

    .footer-container-eo {
      max-width: 1140px;
      margin: 0 auto;
    }

    /* الصف العلوي للفوتر */
    .footer-top-row-eo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
      padding-bottom: 28px;
      border-bottom: 1px solid #1e293b;
    }

    /* الجانب الأيمن: اللوجو والوصف */
    .footer-brand-wrap-eo {
      max-width: 540px;
    }

    .footer-brand-title-eo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #ffffff;
      font-size: 21px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    /* أيقونة المحراب / المسجد الخضراء */
    .footer-brand-logo-eo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background-color: #059669;
      color: #fde047;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(5, 150, 105, 0.3);
    }

    .footer-brand-logo-eo svg {
      width: 20px;
      height: 20px;
    }

    .footer-brand-desc-eo {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.65;
      font-weight: 500;
      margin: 0;
    }

    /* الجانب الأيسر: بطاقات الضمان الثلاثة */
    .footer-guarantees-grid-eo {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      min-width: 420px;
    }

    .footer-guarantee-card-eo {
      background-color: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(51, 65, 85, 0.8);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      transition: all 0.25s ease;
    }

    .footer-guarantee-card-eo:hover {
      background-color: rgba(30, 41, 59, 0.95);
      border-color: #059669;
      transform: translateY(-2px);
    }

    .footer-guarantee-icon-eo {
      width: 20px;
      height: 20px;
      color: #34d399;
      stroke-width: 2.2;
    }

    .footer-guarantee-text-eo {
      font-size: 12.5px;
      font-weight: 800;
      color: #ffffff;
      white-space: nowrap;
    }

    /* الصف السفلي: حقوق الملكية */
    .footer-bottom-row-eo {
      padding-top: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      font-size: 12.5px;
      color: #64748b;
      font-weight: 600;
    }

    /* التجاوب مع الهواتف والشاشات الصغيرة */
    @media (max-width: 860px) {
      .footer-top-row-eo {
        flex-direction: column;
        align-items: flex-start;
        gap: 24px;
      }
      .footer-brand-wrap-eo {
        max-width: 100%;
      }
      .footer-guarantees-grid-eo {
        min-width: 100%;
        width: 100%;
      }
      .footer-bottom-row-eo {
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 8px;
      }
    }

    @media (max-width: 480px) {
      .footer-guarantees-grid-eo {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .footer-guarantee-card-eo {
        flex-direction: row;
        padding: 10px 14px;
      }
    }
  </style>
</head>
<body>

  <!-- ============================================== -->
  <!-- بداية سيكشن الفوتر (Easy Order) -->
  <!-- ============================================== -->
  <footer class="footer-section-eo" id="site-footer">
    <div class="footer-container-eo">

      <!-- الصف العلوي للفوتر -->
      <div class="footer-top-row-eo">

        <!-- اليمين: معلومات البراند -->
        <div class="footer-brand-wrap-eo">
          <div class="footer-brand-title-eo">
            <div class="footer-brand-logo-eo">
              <!-- أيقونة المحراب الإسلامي -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 22h16"></path>
                <path d="M6 18V9a6 6 0 0 1 12 0v9"></path>
                <path d="M9 18v-4a3 3 0 0 1 6 0v4"></path>
                <circle cx="12" cy="5" r="1" fill="currentColor"></circle>
              </svg>
            </div>
            <span>سجادة الصلاة الطبية</span>
          </div>

          <p class="footer-brand-desc-eo">
            سجادة الصلاة الطبية الفاخرة (115×65 سم، سُمك 1.5 سم) لحماية الركبتين والمفاصل، الدفع عند الاستلام مع ضمان 14 يوماً للاستبدال والاسترجاع.
          </p>
        </div>

        <!-- اليسار: بطاقات الضمان الثلاثة بنفس الترتيب (يمين لليسار) -->
        <div class="footer-guarantees-grid-eo">

          <!-- 1. معاينة قبل الدفع -->
          <div class="footer-guarantee-card-eo">
            <svg class="footer-guarantee-icon-eo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"></path>
              <path d="M15 18H9"></path>
              <path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"></path>
              <circle cx="17" cy="18.5" r="2.5"></circle>
              <circle cx="7" cy="18.5" r="2.5"></circle>
            </svg>
            <span class="footer-guarantee-text-eo">معاينة قبل الدفع</span>
          </div>

          <!-- 2. استبدال 14 يوم -->
          <div class="footer-guarantee-card-eo">
            <svg class="footer-guarantee-icon-eo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
              <path d="M3 3v5h5"></path>
            </svg>
            <span class="footer-guarantee-text-eo">استبدال 14 يوم</span>
          </div>

          <!-- 3. سُمك 1.5 سم -->
          <div class="footer-guarantee-card-eo">
            <svg class="footer-guarantee-icon-eo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              <path d="m9 12 2 2 4-4"></path>
            </svg>
            <span class="footer-guarantee-text-eo">سُمك 1.5 سم</span>
          </div>

        </div>

      </div>

      <!-- الصف السفلي: حقوق الملكية والشعار التعبيري -->
      <div class="footer-bottom-row-eo">
        <p>© 2026 سجادة الصلاة الطبية. جميع الحقوق محفوظة.</p>
        <span>راحة تامة وسكينة في كل سجدة</span>
      </div>

    </div>
  </footer>
  <!-- ============================================== -->
  <!-- نهاية سيكشن الفوتر -->
  <!-- ============================================== -->

</body>
</html>
